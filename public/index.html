<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Pagachain Explorer</title>
  <meta name="description" content="Explorador ligero de Pagachain: bloques, transacciones, PAGA y CENT en directo.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.png" alt="">
        <span>Pagachain Explorer<small>cadena 3690369</small></span>
      </a>
      <form id="search-form" role="search">
        <input id="search-input" name="q" type="search" placeholder="Buscar bloque, transacción o dirección" autocomplete="off" enterkeyhint="search">
        <button class="btn" type="submit">Buscar</button>
      </form>
      <div class="height">Bloque <b id="chain-height">…</b></div>
    </div>
  </header>
  <div class="wrap"><p id="search-msg"></p></div>
  <main class="wrap" id="app"></main>
  <footer>
    <div class="wrap">
      <div>Pagachain Explorer · sin base de datos · lee la cadena en directo</div>
      <div id="rpc-status">Conectando…</div>
    </div>
  </footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
