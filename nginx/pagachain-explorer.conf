# Pagachain Explorer — sitio por defecto en el puerto 80
# Rutas EIP-3091: /block/, /tx/, /address/, /token/  (try_files → index.html)
# Reserva /rpc → https://pagachain.com por si el navegador no puede hablar con el RPC.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /rpc {
        proxy_pass https://pagachain.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host pagachain.com;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept application/json;
        proxy_set_header User-Agent $http_user_agent;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
